[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"  # Updated to Node 20 as required by your dependencies
  NPM_FLAGS = "--production=false"
  NODE_ENV = "production"

# Configure secret scanning
[build.processing]
  skip_processing = false  # Enable processing to apply our custom rules

# Disable secret scanning for specific files and directories
[context.production.environment]
  SECRETS_SCAN_OMIT_PATHS = "dist/assets/*"
  SECRETS_SCAN_OMIT_KEYS = "VITE_*"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;"

# Cache control for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = ["Path!=/*.*"]  # Don't redirect actual files
