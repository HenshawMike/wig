[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Disable secrets scanning for client-side VITE_ variables (they are public)
[build.processing]
  skip_processing = false

# Omit VITE_ variables from secrets scanning (they are meant to be public)
[build]
  environment = { SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_WHATSAPP_BUSINESS_NUMBER,VITE_GOOGLE_CLIENT_ID,VITE_GOOGLE_CLIENT_SECRET,VITE_GOOGLE_REDIRECT_URl" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
